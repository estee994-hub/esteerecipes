.note { background: rgba(102,114,58,.12); border:1px solid rgba(102,114,58,.32); color:#3f4f29; padding:12px 16px; border-radius:12px; font-size:14px; font-weight:500; }
.check { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:18px; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--soft); cursor:pointer; }
.check.on { background:var(--accent); color:#fff; border-color:var(--accent); }

@keyframes rise { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
.spin { width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px;}
@keyframes sp{to{transform:rotate(360deg);}}
.cook-grid { display:grid; grid-template-columns: 320px 1fr; gap:40px; }
@media (max-width:760px){ .cook-grid{ grid-template-columns:1fr; gap:20px;} .nav button{padding:8px 11px;font-size:13px;} }
.syncdot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--sage); margin-right:6px; vertical-align:1px; }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const SUPABASE_URL = "https://ctdxetwhhwkhkmvclmbu.supabase.co";

let sb = null;
if (configured) { try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error(e); } }

// ---------- constants ----------
const CATS = ["Mains", "Soups", "Salads", "Cakes", "Cookies", "Sides", "Drinks", "Other"];
const CAT_COLOR = {
  Mains: ["#D5DCC3", "#505a30"], Soups: ["#D9E1CE", "#566b3a"], Salads: ["#DEE7D0", "#4f6630"],
  Cakes: ["#F0D6D9", "#9c5f68"], Cookies: ["#F0DBC6", "#9c6a45"], Sides: ["#E8E2D2", "#6b6243"],
  Drinks: ["#D7E1DB", "#46604f"], Other: ["#E2E1D3", "#5f6451"],
};
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const SLOTS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["dinner", "Dinner"], ["snack", "Snacks"], ["dessert", "Dessert"]];
const inferMeals = (cats) => { const c = cats || []; return (c.includes("Cakes") || c.includes("Cookies")) ? ["dessert", "snack"] : c.includes("Drinks") ? ["snack"] : ["lunch", "dinner"]; };
const VEG = ["tomato","lettuce","spinach","carrot","broccoli","cucumber","pepper","onion","courgette","zucchini","kale","salad","bean","pea","cabbage","mushroom","celery","leek","green","avocado","beet","squash","cauliflower","corn","asparagus","berries","fruit","apple","banana"];

const SEED = [
  { id: "s5", title: "Overnight Oats & Berries", categories: ["Other"], meals: ["breakfast"], timeMinutes: 5, servings: 1, photo: null,
    ingredients: [ {name:"oats",amount:50,unit:"g",display:"50 g rolled oats"},{name:"milk",amount:150,unit:"ml",display:"150 ml milk"},{name:"yogurt",amount:2,unit:"tbsp",display:"2 tbsp yogurt"},{name:"honey",amount:1,unit:"tbsp",display:"1 tbsp honey"},{name:"berries",amount:1,unit:"cup",display:"1 cup mixed berries"} ],
    steps: ["Stir oats, milk, yogurt and honey together in a jar.","Chill overnight.","Top with berries before eating."], notes: "" },

    steps: ["Heat oven to 200°C. Toss tomatoes, onion and garlic with olive oil on a tray.","Roast 30 minutes until soft and caramelised.","Blend the roasted veg with the stock and most of the basil until smooth.","Warm through, season, finish with torn basil."], notes: "" },

    ingredients: [ {name:"chicken thigh",amount:8,unit:null,display:"8 chicken thighs"},{name:"potato",amount:6,unit:null,display:"6 potatoes, chunked"},{name:"lemon",amount:2,unit:null,display:"2 lemons"},{name:"garlic",amount:6,unit:null,display:"6 garlic cloves"},{name:"olive oil",amount:2,unit:"tbsp",display:"2 tbsp olive oil"},{name:"rosemary",amount:2,unit:"tbsp",display:"2 tbsp rosemary"} ],

  { id: "s3", title: "Crunchy Chickpea Salad", categories: ["Salads","Mains"], meals: ["lunch"], timeMinutes: 15, servings: 2, photo: null,
    ingredients: [ {name:"chickpeas",amount:1,unit:"can",display:"1 can chickpeas, drained"},{name:"cucumber",amount:1,unit:null,display:"1 cucumber, diced"},{name:"tomato",amount:2,unit:null,display:"2 tomatoes, diced"},{name:"red onion",amount:1,unit:null,display:"1/2 red onion, sliced"},{name:"lemon",amount:1,unit:null,display:"1 lemon, juiced"},{name:"olive oil",amount:2,unit:"tbsp",display:"2 tbsp olive oil"} ],
    steps: ["Combine chickpeas, cucumber, tomato and onion in a bowl.","Whisk lemon juice with olive oil, salt and pepper.","Dress, toss, rest 5 minutes."], notes: "" },
  { id: "s4", title: "Quick Garlic Butter Pasta", categories: ["Mains"], meals: ["lunch","dinner"], timeMinutes: 12, servings: 2, photo: null,
    ingredients: [ {name:"pasta",amount:200,unit:"g",display:"200 g spaghetti"},{name:"garlic",amount:3,unit:null,display:"3 garlic cloves, sliced"},{name:"butter",amount:50,unit:"g",display:"50 g butter"},{name:"parmesan",amount:40,unit:"g",display:"40 g parmesan, grated"},{name:"parsley",amount:2,unit:"tbsp",display:"2 tbsp parsley"} ],
    steps: ["Boil pasta in salted water until al dente.","Melt butter, soften garlic gently — don't brown it.","Toss drained pasta in the garlic butter with a splash of pasta water.","Finish with parmesan and parsley."], notes: "" },
  { id: "s6", title: "Vanilla Bean Cookies", categories: ["Cookies"], meals: ["dessert","snack"], timeMinutes: 25, servings: 12, photo: null,
    ingredients: [ {name:"butter",amount:120,unit:"g",display:"120 g soft butter"},{name:"sugar",amount:100,unit:"g",display:"100 g sugar"},{name:"flour",amount:200,unit:"g",display:"200 g plain flour"},{name:"egg",amount:1,unit:null,display:"1 egg"},{name:"vanilla",amount:1,unit:"tsp",display:"1 tsp vanilla"} ],
    steps: ["Cream butter and sugar until pale.","Beat in egg and vanilla, then fold in flour.","Roll into balls, flatten on a lined tray.","Bake at 180°C for 11–13 minutes until edges turn gold."], notes: "" },
];

// ---------- helpers ----------
const norm = (s) => (s || "").toLowerCase().trim();
const fmtAmt = (n) => { if (n == null) return ""; return String(Math.round(n * 100) / 100); };
const fmtScaled = (n) => {
  if (n == null) return "";
  const whole = Math.floor(n); const frac = n - whole;
  const eighth = Math.round(frac * 8) / 8;
  const map = { 0.125:"⅛",0.25:"¼",0.375:"⅜",0.5:"½",0.625:"⅝",0.75:"¾",0.875:"⅞" };
  if (eighth === 1) return String(whole + 1);
  const fsym = map[eighth];
  if (n < 10 && fsym) return whole ? `${whole}${fsym}` : fsym;
  return String(Math.round(n * 100) / 100);
};
function timeBand(m){ if(m<=15)return "≤ 15 min"; if(m<=30)return "15–30 min"; if(m<=60)return "30–60 min"; return "1 hr +"; }
const BANDS = ["≤ 15 min","15–30 min","30–60 min","1 hr +"];

function compressImage(file, cb){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{ const img = new Image();
    img.onload = ()=>{ const max=900; let w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg",0.72)); }catch(_){ cb(e.target.result); } };
    img.src=e.target.result; };
  reader.readAsDataURL(file);
}

function normalizeDraft(p){
  p.timeMinutes = Number(p.timeMinutes)||30;
  p.servings = Number(p.servings)||2;
  p.ingredients = (p.ingredients||[]).map(i=>({ name:i.name||"", amount:(i.amount==null||i.amount==="")?null:Number(i.amount), unit:i.unit||null, display:i.display||i.name||"" }));
  p.steps = p.steps||[];
  let cats = Array.isArray(p.categories)?p.categories:(p.category?[p.category]:[]);
  cats = cats.filter(c=>CATS.includes(c)); if(!cats.length) cats=["Other"];
  p.categories = cats; delete p.category;
  const valid = ["breakfast","lunch","dinner","snack","dessert"];
  p.meals = Array.isArray(p.meals)?p.meals.filter(m=>valid.includes(m)):[];
  if(!p.meals.length) p.meals = inferMeals(p.categories);
  p.notes = p.notes||"";
  if(p.photo===undefined) p.photo=null;
  return p;
}

// ---------- data layer (Supabase) ----------
async function dbLoadRecipes(){ const { data, error } = await sb.from("recipes").select("doc, updated_at").order("updated_at",{ascending:false}); if(error) throw error; return (data||[]).map(r=>r.doc); }
async function dbSaveRecipe(doc){ const { error } = await sb.from("recipes").upsert({ id: doc.id, doc, updated_at: new Date().toISOString() }); if(error) throw error; }
async function dbDeleteRecipe(id){ const { error } = await sb.from("recipes").delete().eq("id", id); if(error) throw error; }
async function dbLoadPlan(){ const { data } = await sb.from("app_state").select("value").eq("key","plan").maybeSingle(); return data ? data.value : {}; }
async function dbSavePlan(plan){ await sb.from("app_state").upsert({ key:"plan", value: plan }); }

// ============================================================
function App(){
  if(!configured || !sb) return <SetupScreen />;
  return <RecipeBook />;
}

function SetupScreen(){
  return (
    <div className="wrap">
      <div className="top"><div><div className="brand">Estee's Pantry</div><div className="sub">Recipe Book</div></div></div>
      <div className="panel" style={{maxWidth:680}}>
        <h2 className="serif" style={{fontSize:26,marginBottom:10}}>Almost there — one setup step</h2>
        <p style={{color:"var(--soft)",marginBottom:16}}>This site needs to be connected to your free Supabase database so the whole family shares one recipe book. Open this file in a text editor and paste your two values near the top, where it says <b>STEP 1 SETUP</b>:</p>
        <div className="code">const SUPABASE_URL = "https://xxxxx.supabase.co";{"\n"}const SUPABASE_ANON_KEY = "eyJhbGci...your long key...";</div>
        <p style={{color:"var(--soft)",marginTop:16,fontSize:14}}>You'll find both at supabase.com → your project → Settings → API. Save the file and refresh — this screen disappears once the values are in.</p>
      </div>
    </div>
  );
}

function RecipeBook(){
  const [recipes, setRecipes] = useState(null);
  const [plan, setPlan] = useState({});
  const [view, setView] = useState("library");
  const [cooking, setCooking] = useState(null);
  const [err, setErr] = useState("");

  const reload = async ()=>{
    try{
      let list = await dbLoadRecipes();
      if(!list.length){ for(const s of SEED){ await dbSaveRecipe(s); } list = await dbLoadRecipes(); }
      setRecipes(list.map(x=>{ let cats=Array.isArray(x.categories)?x.categories.filter(c=>CATS.includes(c)):(CATS.includes(x.category)?[x.category]:["Other"]); if(!cats.length)cats=["Other"]; const {category,...rest}=x; return {...rest, categories:cats, meals:x.meals||inferMeals(cats), photo:x.photo||null }; }));
      const p = await dbLoadPlan(); setPlan(p||{});
    }catch(e){ console.error(e); setErr("Couldn't reach the database. Check your Supabase values and that the tables exist."); setRecipes([]); }
  };

  useEffect(()=>{ reload();
    let ch=null;
    try{ ch = sb.channel("rb-changes").on("postgres_changes",{event:"*",schema:"public",table:"recipes"},()=>reload()).subscribe(); }catch(e){}
    return ()=>{ if(ch) try{ sb.removeChannel(ch); }catch(e){} };
  },[]);

  const saveRecipe = async (doc)=>{ setRecipes(prev=>{ const others=(prev||[]).filter(r=>r.id!==doc.id); return [doc,...others]; }); try{ await dbSaveRecipe(doc); }catch(e){ setErr("Save failed — check your connection."); } };
  const deleteRecipe = async (id)=>{ setRecipes(prev=>(prev||[]).filter(r=>r.id!==id)); try{ await dbDeleteRecipe(id); }catch(e){} };
  const savePlan = async (next)=>{ setPlan(next); try{ await dbSavePlan(next); }catch(e){} };

  if(recipes===null) return <div className="wrap"><p style={{color:"var(--soft)"}}>Opening your book…</p></div>;

  return (
    <div className="wrap">
      {!cooking && (
        <div className="top">
          <div><div className="brand">Estee's Pantry</div><div className="sub">Recipe Book</div></div>
          <div className="nav">
            {[["library","Library"],["fridge","From my fridge"],["planner","Week"],["add","+ Add"]].map(([k,l])=>(
              <button key={k} className={view===k?"on":""} onClick={()=>setView(k)}>{l}</button>
            ))}
          </div>
        </div>
      )}
      {err && <div className="note" style={{marginBottom:16,background:"rgba(176,106,133,.12)",borderColor:"rgba(176,106,133,.4)",color:"#8a4a63"}}>{err}</div>}
      {cooking && <CookView recipe={cooking} onClose={()=>setCooking(null)} onSaveRecipe={(d)=>{ saveRecipe(d); setCooking(d); }} />}
      {!cooking && view==="library" && <Library recipes={recipes} onCook={setCooking} onDelete={deleteRecipe} />}
      {!cooking && view==="fridge" && <Fridge recipes={recipes} onCook={setCooking} />}
      {!cooking && view==="planner" && <Planner recipes={recipes} plan={plan} setPlan={savePlan} />}
      {!cooking && view==="add" && <AddRecipe onSave={(r)=>{ const id="r"+Date.now(); const doc={...r,id}; saveRecipe(doc); setView("library"); }} />}
    </div>
  );
}

function Card({ r, onClick }){
  const cats = r.categories && r.categories.length ? r.categories : ["Other"];
  const [bg] = CAT_COLOR[cats[0]] || CAT_COLOR.Other;
  const topStyle = r.photo

function Fridge({ recipes, onCook }){
  const [have,setHave]=useState([]); const [input,setInput]=useState(""); const [mode,setMode]=useState("uses");
  const add=(val)=>{ const v=norm(val); if(v&&!have.includes(v)) setHave([...have,v]); setInput(""); };
  const suggestions = useMemo(()=>{ const count={}; recipes.forEach(r=>r.ingredients.forEach(i=>{const n=norm(i.name); if(n)count[n]=(count[n]||0)+1;})); return Object.entries(count).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,18); },[recipes]);
  const results = useMemo(()=>{ if(!have.length) return [];
    return recipes.map(r=>{ const usesAll=have.every(h=>r.ingredients.some(i=>norm(i.name).includes(h)||h.includes(norm(i.name)))); const missing=r.ingredients.filter(i=>!have.some(h=>norm(i.name).includes(h)||h.includes(norm(i.name)))); return {r,usesAll,missing}; })
      .filter(x=>mode==="uses"?x.usesAll:x.usesAll&&x.missing.length===0).sort((a,b)=>a.missing.length-b.missing.length);
  },[have,mode,recipes]);
  return (
    <div>
      <div className="panel" style={{marginBottom:22}}>
        <h2 className="serif" style={{fontSize:24,marginBottom:6}}>What's in your kitchen?</h2>
        <p style={{color:"var(--soft)",marginBottom:16,fontSize:15}}>Add a few ingredients and I'll find what you can cook.</p>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <input className="input" placeholder="e.g. tomato, then Enter" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add(input)} />
          <button className="btn accent" onClick={()=>add(input)}>Add</button>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
          {have.map(h=><span key={h} className="tag-add">{h}<button onClick={()=>setHave(have.filter(x=>x!==h))}>✕</button></span>)}
        </div>
        <span className="label" style={{display:"block",marginBottom:10}}>Or tap an ingredient you have</span>
        <div className="sugg" style={{marginBottom:18}}>
          {suggestions.map(s=><button key={s} className={have.includes(s)?"used":""} onClick={()=>add(s)} disabled={have.includes(s)}>{have.includes(s)?"✓ ":"+ "}{s}</button>)}
        </div>
        <div className="filters" style={{margin:0}}>
          <button className={"pill"+(mode==="uses"?" on":"")} onClick={()=>setMode("uses")}>Uses these (+ extras ok)</button>
          <button className={"pill"+(mode==="only"?" on":"")} onClick={()=>setMode("only")}>Only what I have</button>
        </div>
      </div>
      {have.length===0 ? <div className="empty"><p>Add ingredients above to begin.</p></div> :
        results.length===0 ? <div className="empty"><h2>No matches</h2><p>Try "uses these" mode, or fewer ingredients.</p></div> :
          <div className="grid">{results.map(({r,missing})=>(
            <div key={r.id} style={{position:"relative"}}>
              <Card r={r} onClick={()=>onCook(r)} />
              {missing.length>0 ? <div style={{marginTop:6,fontSize:13,color:"var(--soft)"}}>needs {missing.length} more: {missing.slice(0,3).map(m=>m.name).join(", ")}{missing.length>3?"…":""}</div>
                : <div style={{marginTop:6,fontSize:13,color:"var(--accent)",fontWeight:600}}>✓ you have everything</div>}
            </div>))}
          </div>}
    </div>
  );
}

function dayNote(dishes){
  if(!dishes.length) return null;
  const names = dishes.flatMap(d=>d.ingredients.map(i=>norm(i.name))).join(" ");
  const has=(arr)=>arr.some(w=>names.includes(w));
  const veg=has(VEG),prot=has(PROT),carb=has(CARB);
  if(carb&&!veg) return {t:"warn",m:"Leans on starch — a salad or veg side would balance it."};
  if(!veg) return {t:"warn",m:"Light on vegetables today."};
  if(!prot) return {t:"warn",m:"Could use a protein."};
  return {t:"ok",m:"Nicely balanced."};
}

function Planner({ recipes, plan, setPlan }){
  const [checked,setChecked]=useState({}); const [copied,setCopied]=useState(false);
  const getSlot=(day,slot)=>(plan[day]&&typeof plan[day]==="object")?plan[day][slot]:undefined;
  const setSlot=(day,slot,val)=>{ const cur=(plan[day]&&typeof plan[day]==="object")?plan[day]:{}; setPlan({...plan,[day]:{...cur,[slot]:val}}); };
  const dishesFor=(day)=>SLOTS.map(([s])=>recipes.find(r=>r.id===getSlot(day,s))).filter(Boolean);
  const allPlanned=DAYS.flatMap(d=>dishesFor(d));
  const shopping = useMemo(()=>{ const map={};
    allPlanned.forEach(r=>r.ingredients.forEach(i=>{ const key=norm(i.name)+"|"+(i.unit||""); if(!map[key])map[key]={name:i.name,unit:i.unit,amount:0,hasNum:true,lines:[]}; if(i.amount==null){map[key].hasNum=false;map[key].lines.push(i.display);} else map[key].amount+=i.amount; }));
    return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
  },[JSON.stringify(plan),recipes]);
  const listText = shopping.map(it=>(it.hasNum?`${fmtAmt(it.amount)}${it.unit?" "+it.unit:""} `:"")+it.name+(!it.hasNum&&it.lines.length?` (${it.lines.join("; ")})`:"")).join("\n");
  const copyList=async()=>{ try{ await navigator.clipboard.writeText(listText); setCopied(true); setTimeout(()=>setCopied(false),1800); }catch(e){} };
  return (
    <div>
      <h2 className="serif" style={{fontSize:24,marginBottom:14}}>This week's plan</h2>
      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",marginBottom:28}}>
        {DAYS.map(d=>{ const note=dayNote(dishesFor(d));
          return (
            <div className="day" key={d}>
              <h4>{d}</h4>
              {SLOTS.map(([s,label])=>{ const opts=recipes.filter(r=>(r.meals||inferMeals(r.categories)).includes(s));
                return (<div className="slot" key={s}><span className="slotlabel">{label}</span>
                  <select className="daypick" value={getSlot(d,s)||""} onChange={e=>setSlot(d,s,e.target.value)}>
                    <option value="">—</option>
                    {opts.map(r=><option key={r.id} value={r.id}>{r.title}</option>)}
                  </select></div>);
              })}
              {note && <div className="daynote" style={{color:note.t==="ok"?"var(--accent)":"var(--gold)"}}>{note.t==="ok"?"🥗 ":"• "}{note.m}</div>}
            </div>);
        })}
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,flexWrap:"wrap",gap:10}}>
        <h2 className="serif" style={{fontSize:24}}>Shopping list</h2>
        {shopping.length>0 && <button className="btn pink" onClick={copyList}>{copied?"✓ Copied":"Copy list"}</button>}
      </div>
      <p style={{color:"var(--soft)",marginBottom:16,fontSize:14}}>Combined automatically across every meal — duplicate ingredients add together.</p>
      {shopping.length===0 ? <div className="empty"><p>Pick some meals above and your list builds itself.</p></div> :
        <div className="panel">
          {shopping.map((it,k)=>(
            <div key={k} className={"ing"+(checked[k]?" done":"")} onClick={()=>setChecked({...checked,[k]:!checked[k]})}>
              <div className="box">{checked[k]?"✓":""}</div>
              <span style={{fontSize:16}}><b style={{fontWeight:600}}>{it.hasNum?`${fmtAmt(it.amount)}${it.unit?" "+it.unit:""} `:""}</b>{it.name}{!it.hasNum&&it.lines.length?` (${it.lines.join("; ")})`:""}</span>
            </div>
          ))}
        </div>}
    </div>
  );
}

const SCHEMA = `{"title":string,"categories":one or more of [${CATS.join(", ")}] as an array,"meals":any of ["breakfast","lunch","dinner","snack","dessert"],"timeMinutes":integer total minutes,"servings":integer,"ingredients":[{"name":"short canonical name e.g. onion","amount":number or null,"unit":"g/ml/cup/tbsp/tsp/can or null (null for whole counts)","display":"the original line"}],"steps":["concise instruction strings"],"notes":"string, may be empty"}`;
const PORTABLE_PROMPT = `Convert the recipe below into ONE JSON object. Output ONLY the JSON — no explanation, no markdown fences.\n\nFormat: ${SCHEMA}\n\nRecipe to convert (paste the text here, or attach a photo to this chat):\n`;

      </div>
      <div style={{display:"flex",gap:10}}>
        <button className="btn accent" onClick={()=>onSave({...r,categories:(r.categories&&r.categories.length)?r.categories:["Other"],photo:photo||null,ingredients:r.ingredients.filter(i=>i.name.trim()),steps:r.steps.filter(s=>s.trim())})}>{editing?"Save changes":"Save to book"}</button>
        <button className="btn ghost" onClick={onCancel}>{editing?"Cancel":"Back"}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
